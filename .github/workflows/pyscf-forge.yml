name: Build pyscf-forge

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - pyscf-forge/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.47.0
          cache: true
          locked: false

      - name: Build and upload
        shell: bash
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY_M }}

        run: |
          pixi run rattler-build build --recipe-dir pyscf-forge \
            --skip-existing=all --target-platform=linux-64 \
            -c conda-forge

          # ignore errors because we want to ignore duplicate packages
          for file in output/**/*.conda; do
            pixi run rattler-build upload anaconda -o mokit "$file" || true
          done
