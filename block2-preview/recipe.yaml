context:
  version: 0.5.4rc17

package:
  name: block2
  version: ${{ version }}

source:
  git: https://github.com/block-hczhai/block2-preview.git
  rev: 2bc9a690b462388d06a9cf997019f3fdb41be219

build:
  number: 1
  script:
    content: |
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
        -DUSE_MKL=OFF -DF77UNDERSCORE=ON \
        -DBUILD_LIB=ON -DBUILD_EXE=ON -DLARGE_BOND=ON \
        -DUSE_KSYMM=OFF -DUSE_COMPLEX=ON -DUSE_SINGLE_PREC=ON \
        -DUSE_SG=ON -DUSE_SANY=ON \
        -DPython3_EXECUTABLE_HINT=$PYTHON $CMAKE_ARGS
      cmake --build build --config Release -j3

      SITE_PKGS=$($PYTHON -c 'import site; print(site.getsitepackages()[0])')
      mkdir -p "$SITE_PKGS" "$PREFIX/bin"
      cp build/block2.so "$SITE_PKGS/block2.so"
      cp -r pyblock2 "$SITE_PKGS/pyblock2"
      cp build/block2 "$PREFIX/bin/block2"
      for s in pyblock2/driver/block2main pyblock2/driver/gaopt \
               pyblock2/driver/readwfn.py pyblock2/driver/writewfn.py; do
        cp "$s" "$PREFIX/bin/" && chmod +x "$PREFIX/bin/$(basename "$s")"
      done

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cmake <4.0
  - python
  - pip
  - setuptools
  host:
  - python
  - pip
  - setuptools
  - cmake <4.0
  - pybind11 !=2.10.3,!=2.10.4,!=2.11.0,!=2.11.1
  - libblas
  - libcblas
  - lapack
  - if: linux
    then:
      - libgomp
  run:
  - python
  - numpy
  - scipy
  - psutil
  - libblas
  - libcblas
  - lapack
  - if: linux
    then:
      - libgomp

tests:
- python:
    imports:
    - block2
    pip_check: true
- script:
    # integrated DMRG driver smoke test from the upstream test suite
    - block2main -v
    - cp tests/driver/dmrg.conf dmrg.conf
    - cp tests/driver/FCIDUMP FCIDUMP
    - block2main dmrg.conf
  files:
    source:
    - tests/driver/dmrg.conf
    - tests/driver/FCIDUMP

about:
  homepage: https://github.com/block-hczhai/block2-preview
  summary: An efficient MPO implementation of DMRG for quantum chemistry.
  license: GPL-3.0-only
