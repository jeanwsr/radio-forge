context:
  version: 0.5.4rc17

package:
  name: block2
  version: ${{ version }}

source:
  git: https://github.com/block-hczhai/block2-preview.git
  rev: 2bc9a690b462388d06a9cf997019f3fdb41be219
  patches:
    - 02-openblas.patch

build:
  number: 0
  script:
    env:
      BLOCK2_USE_MKL: "OFF"
    content: |
      ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  build:
  - ${{ compiler('c') }}
  - ${{ compiler('cxx') }}
  - cmake <4.0
  - python
  - pip
  - setuptools
  host:
  - python
  - pip
  - setuptools
  - cmake <4.0
  - pybind11 !=2.10.3,!=2.10.4,!=2.11.0,!=2.11.1
  - libblas
  - libcblas
  - lapack
  - if: linux
    then:
      - libgomp
  run:
  - python
  - numpy
  - scipy
  - psutil
  - libblas
  - libcblas
  - lapack
  - if: linux
    then:
      - libgomp

tests:
- python:
    imports:
    - block2
    pip_check: true
- script:
    # integrated DMRG driver smoke test from the upstream test suite
    - block2main -v
    - cp tests/driver/dmrg.conf dmrg.conf
    - cp tests/driver/FCIDUMP FCIDUMP
    - block2main dmrg.conf
  files:
    source:
    - tests/driver/dmrg.conf
    - tests/driver/FCIDUMP

about:
  homepage: https://github.com/block-hczhai/block2-preview
  summary: An efficient MPO implementation of DMRG for quantum chemistry.
  license: GPL-3.0-only
